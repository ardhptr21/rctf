services:
  traefik:
    image: traefik:v3.6.8
    restart: unless-stopped
    container_name: ${TRAEFIK_CONTAINER_NAME:-ti-traefik}
    command:
      - --configFile=/etc/traefik/traefik.yml
    env_file:
      - .env
    networks:
      - tiny-network
    ports:
      - "${TRAEFIK_HTTPS_PORT:-443}:${TRAEFIK_HTTPS_PORT:-443}"
      - "${TRAEFIK_HTTP_PORT:-80}:${TRAEFIK_HTTP_PORT:-80}"
      - "${TRAEFIK_TCP_PORT:-1337}:${TRAEFIK_TCP_PORT:-1337}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./conf/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./conf/tls.yml:/etc/traefik/dynamic/tls.yml:ro
      - ./conf/middlewares.yml:/etc/traefik/dynamic/middlewares.yml:ro
      - ./conf/tcplog-transport.yml:/etc/traefik/dynamic/tcplog-transport.yml:ro
      - ./certs/:/certs/:ro
    # the access log goes to stdout; keep Docker's copy of it bounded
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: '5'
  # sends Traefik's access log to rCTF as the instances' request logs
  vector:
    image: timberio/vector:0.43.1-alpine
    restart: unless-stopped
    container_name: ti-vector
    command: ['--config', '/etc/vector/vector.yaml']
    env_file:
      - .env
    networks:
      rctf:
      tiny-network:
    depends_on:
      - traefik
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./conf/vector.yaml:/etc/vector/vector.yaml:ro
  cache:
    image: redis:8.2.6
    restart: unless-stopped
    networks:
      - tiny-network
    env_file:
      - .env
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}']
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass ${REDIS_PASSWORD} ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ./.data/redis:/data
  # not a running service: the image of the logging proxy the instancer puts
  # in front of each tcp-ssl expose. `docker compose build` builds it; without
  # it TCP connections are not logged (see TCPLOG_* in the instancer's config)
  tcplog:
    build:
      context: ../../apps/docker-instancer/tcplog
    image: tiny-instancer-tcplog:latest
    profiles: [build]
  tiny-instancer:
    build:
      context: ../..
      dockerfile: deploy/docker-instancer/Dockerfile
    image: tiny-instancer:latest
    restart: unless-stopped
    container_name: tiny-instancer
    networks:
      rctf:
      tiny-network:
    depends_on:
      - traefik
      - cache
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      # Exposed to 127.0.0.1 only because rctf will reach it through a tiny-network network
      # If you're hosting tiny-instancer separately (which you should), expose this globally and make sure to put a firewall
      - "127.0.0.1:12237:1337"

networks:
  tiny-network:
  rctf:
    name: rctf_network
    external: true
